<svg viewBox="0 0 260 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ciclone separador, símbolo estilo P&amp;ID">
  <title>CY-101 — Ciclone (P&amp;ID)</title>
  <defs>
    <marker id="seta_cy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- corpo cilindrico -->
  <rect x="90" y="40" width="80" height="120" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
  <!-- cone -->
  <path d="M 90 160 L 170 160 L 130 280 Z" fill="#F3F4F6" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- duto de entrada tangencial -->
  <rect x="170" y="55" width="45" height="18" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
  <line x1="215" y1="64" x2="230" y2="64" stroke="#374151" stroke-width="1.75"/>
  <line x1="170" y1="64" x2="145" y2="64" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_cy)"/>
  <!-- tubo de saida de gas limpo (vortex finder), interno tracejado -->
  <line x1="130" y1="40" x2="130" y2="80" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="130" y1="40" x2="130" y2="12" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_cy)"/>
  <!-- saida de solidos no apice do cone -->
  <line x1="130" y1="280" x2="130" y2="308" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_cy)"/>
  <text x="130" y="322" text-anchor="middle" font-size="9" fill="#6B7280">sólidos</text>
  <text x="130" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#374151" dominant-baseline="central">CY-101</text>
</svg>
