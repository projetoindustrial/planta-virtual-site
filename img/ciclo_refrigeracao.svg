<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ciclo de refrigeração por compressão de vapor (amônia), símbolo estilo P&amp;ID">
  <title>Ciclo NH3 — Refrigeração por compressão de vapor (P&amp;ID)</title>
  <defs>
    <marker id="seta_r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- condensador (topo) -->
  <rect x="70" y="40" width="180" height="40" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
  <path d="M 85 60 L 95 50 L 105 70 L 115 50 L 125 70 L 135 50 L 145 70 L 155 50 L 165 70 L 175 50 L 185 70 L 195 50 L 205 70 L 215 50 L 225 60" fill="none" stroke="#9CA3AF" stroke-width="1"/>
  <text x="160" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">condensador</text>

  <!-- compressor (esquerda) -->
  <path d="M 40 190 L 40 130 L 70 145 L 70 175 Z" fill="#F3F4F6" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="20" y="165" text-anchor="middle" font-size="10" font-weight="700" fill="#374151" transform="rotate(-90 20 165)">compressor</text>

  <!-- valvula de expansao (direita) -->
  <path d="M 250 145 L 280 130 L 280 190 L 250 175 Z" fill="#F3F4F6" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="300" y="165" text-anchor="middle" font-size="9" fill="#374151" transform="rotate(90 300 165)">válvula exp.</text>

  <!-- evaporador (base) -->
  <rect x="70" y="240" width="180" height="40" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
  <path d="M 85 260 L 95 250 L 105 270 L 115 250 L 125 270 L 135 250 L 145 270 L 155 250 L 165 270 L 175 250 L 185 270 L 195 250 L 205 270 L 215 250 L 225 260" fill="none" stroke="#9CA3AF" stroke-width="1"/>
  <text x="160" y="298" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">evaporador</text>

  <!-- linhas do ciclo (sentido horario) -->
  <line x1="70" y1="150" x2="40" y2="150" stroke="#374151" stroke-width="1.75"/>
  <line x1="55" y1="130" x2="55" y2="60" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_r)"/>
  <line x1="55" y1="60" x2="70" y2="60" stroke="#374151" stroke-width="1.75"/>
  <line x1="250" y1="60" x2="280" y2="60" stroke="#374151" stroke-width="1.75"/>
  <line x1="265" y1="60" x2="265" y2="130" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_r)"/>
  <line x1="265" y1="190" x2="265" y2="260" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_r)"/>
  <line x1="250" y1="260" x2="265" y2="260" stroke="#374151" stroke-width="1.75"/>
  <line x1="70" y1="260" x2="55" y2="260" stroke="#374151" stroke-width="1.75"/>
  <line x1="55" y1="260" x2="55" y2="190" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_r)"/>

  <text x="160" y="316" text-anchor="middle" font-size="9" fill="#6B7280">ciclo por compressão de vapor</text>
</svg>
