<svg viewBox="0 0 320 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trocador de calor casco-tubo, símbolo estilo P&amp;ID">
  <title>E-101 — Trocador casco-tubo (P&amp;ID)</title>
  <defs>
    <marker id="seta_e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- casco -->
  <rect x="70" y="70" width="180" height="60" rx="30" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
  <!-- feixe de tubos -->
  <g stroke="#9CA3AF" stroke-width="1.25">
    <line x1="82" y1="85" x2="238" y2="85"/>
    <line x1="82" y1="100" x2="238" y2="100"/>
    <line x1="82" y1="115" x2="238" y2="115"/>
  </g>
  <!-- lado tubo: entrada/saida pelas pontas -->
  <line x1="40" y1="100" x2="70" y2="100" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_e)"/>
  <line x1="250" y1="100" x2="280" y2="100" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_e)"/>
  <!-- lado casco: entrada/saida por cima/baixo -->
  <line x1="100" y1="45" x2="100" y2="70" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_e)"/>
  <line x1="220" y1="130" x2="220" y2="155" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_e)"/>
  <text x="160" y="20" text-anchor="middle" font-size="9" fill="#6B7280">lado casco</text>
  <text x="160" y="180" text-anchor="middle" font-size="9" fill="#6B7280">lado tubo</text>
  <text x="160" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">E-101</text>
</svg>
