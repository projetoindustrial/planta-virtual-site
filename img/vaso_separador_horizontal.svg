  </defs>
  <ellipse cx="70" cy="110" rx="16" ry="46" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
  <rect x="70" y="64" width="180" height="92" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
