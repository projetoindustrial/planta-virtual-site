<svg viewBox="0 0 260 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coluna/leito genérico, símbolo estilo P&amp;ID">
  <title>C-101 — Coluna/leito genérico (P&amp;ID)</title>
  <defs>
    <marker id="seta_c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <ellipse cx="130" cy="50" rx="40" ry="14" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
  <rect x="90" y="50" width="80" height="260" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="130" cy="310" rx="40" ry="14" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
  <line x1="90" y1="50" x2="90" y2="310" stroke="#374151" stroke-width="1.5"/>
  <line x1="170" y1="50" x2="170" y2="310" stroke="#374151" stroke-width="1.5"/>
  <!-- internos genericos: linhas horizontais (pratos/recheio/leito - nao diferenciado) -->
  <g stroke="#9CA3AF" stroke-width="1.25">
    <line x1="95" y1="90" x2="165" y2="90"/>
    <line x1="95" y1="130" x2="165" y2="130"/>
    <line x1="95" y1="170" x2="165" y2="170"/>
    <line x1="95" y1="210" x2="165" y2="210"/>
    <line x1="95" y1="250" x2="165" y2="250"/>
  </g>
  <!-- topo: saida de vapor/gas -->
  <line x1="130" y1="36" x2="130" y2="10" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_c)"/>
  <!-- alimentacao lateral -->
  <line x1="45" y1="170" x2="90" y2="170" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_c)"/>
  <!-- fundo: saida de liquido/produto -->
  <line x1="170" y1="300" x2="205" y2="320" stroke="#374151" stroke-width="1.75" marker-end="url(#seta_c)"/>
  <text x="130" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">C-101</text>
</svg>
